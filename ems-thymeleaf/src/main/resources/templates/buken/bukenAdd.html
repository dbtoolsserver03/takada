<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns:th="http://www.thymealf.org">

<head>
	<title>物件追加画面</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
	<script type="text/javascript" th:src="@{/js/plug-in/jquery/jquery-3.7.1.min.js}"></script>


	<script>

	// HTMLのすべてのタグを読込後、実行する
	$(document).ready(function () {

		$("select[name='rec.densyaType']").change(function () {


			const densyaSelect = $("select[name='rec.densyaNo']")[0];

			// 選択肢を初期化
			densyaSelect.innerHTML = "<option>Loading...</option>";

			$.ajax({

				// request url
				url: 'ajaxGetDensyaName',

				// post,get
				type: 'POST',

				async: false,  // 同期リクエスト

				contentType: 'application/json',

				data: JSON.stringify({

					densyaType: $(this).val()

				}),


				success: function (response) {

					console.log(response.densyaLst);

					densyaSelect.innerHTML = ""; // 初期化
					for (var i = 0; i < response.densyaLst.length; i++) {
						const option = document.createElement("option");
						option.value = response.densyaLst[i].densyaNo;
						option.textContent = response.densyaLst[i].densyaName;
						densyaSelect.appendChild(option);
					}

				},
				error: function (error) {

					alert('error !!');
				}
			});


		});
	});

		
	</script>
</head>

<body>
	<div id="wrap">
		<div id="top_content">
			<div id="header">
				<div id="rightheader">
					<p>
						2009/11/20
						<br />
					</p>
				</div>
				<div id="topheader">
					<h1 id="title">
						<a href="#">main</a>
					</h1>
				</div>
				<div id="navigation">
				</div>
			</div>
			<div id="content">
				<p id="whereami">
				</p>
				<h1>
					物件追加:
				</h1>
				
				

				
				
				<form th:action="@{/buken/addExecute}" method="post" enctype="multipart/form-data">
					<table cellpadding="0" cellspacing="0" border="0" class="form_table">
						<tr>
							<td valign="middle" align="right">
								所在地:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="rec.location" />
							</td>
							
						</tr>
						<tr>
							<td valign="middle" align="right">
								最寄り駅:
							</td>
							
							<td valign="middle" align="left">
							
								<select name="rec.densyaType">
									<option></option>
									<option th:each="entry : ${vo.masterDensyaTypeMap}" th:value="${entry.key}" th:text="${entry.value.mDisplay1}">
									</option>
								</select>
								<select name="rec.densyaNo">
									<option></option>
									<option th:each="entry : ${vo.masterDirectionMap}" th:value="${entry.key}" th:text="${entry.value.mDisplay1}">
									</option>
								</select>
								<select name="rec.direction">
									<option></option>
									<option th:each="entry : ${vo.masterDirectionMap}" th:value="${entry.key}" th:text="${entry.value.mDisplay1}">
									</option>
								</select>
							</td>
							
						</tr>
						<tr>
							<td valign="middle" align="right">
								最寄り駅まで徒歩何分:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="rec.nearStationTime" />
							</td>
						</tr>
						
						<tr>
							<td valign="middle" align="right">
								築年数(yyyy):
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="rec.bukenYear" />
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								間取り:
							</td>
							<td valign="middle" align="left">
								<span th:each="entry : ${vo.masterMadoriMap}">
									<label> <input type="radio" th:value="${entry.key}"
											th:text="${entry.value.mDisplay1}" name="rec.madori" /></label>
								</span>
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								面積:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="rec.area" />
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								向き:
							</td>
							<td valign="middle" align="left">
								
								<select name="rec.direction">
										<option></option>
										<option th:each="entry : ${vo.masterDirectionMap}" th:value="${entry.key}"
											th:text="${entry.value.mDisplay1}"></option>
									</select>
							</td>
						</tr>


						<tr>
							<td valign="middle" align="right">
								限定条件:
							</td>
							<td valign="middle" align="left">
								<textarea  class="inputgri" name="rec.bukenCondition" ></textarea>
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								賃料:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="rec.moneyRent" />
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								敷金:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="rec.moneyDeposit" />
							</td>
						</tr>

		
						<tr>
							<td valign="middle" align="right">
								礼金:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="rec.moneyGift" />
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								管理費/共益費:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="rec.moneyManagement" />
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								建物種別:
							</td>
							<td valign="middle" align="left">
								<span th:each="entry : ${vo.masterTypeMap}">
									<label> <input type="radio" th:value="${entry.key}"
											th:text="${entry.value.mDisplay1}" name="rec.bukenType" /></label>
								</span>
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								設備:
							</td>
							<td valign="middle" align="left">
								<span th:each="entry : ${vo.masterPointMap}">
									<label><input type="checkbox" name="rec.device" th:value="${entry.key}"
											th:text="${entry.value.mDisplay1}"></label>
								</span>
							</td>
						</tr>
	
						
						<tr>
							<td valign="middle" align="right">
								物件アイコン:
							</td>
							<td valign="middle" align="left">
								<input type="file"  class="inputgri" name="urls" multiple/>
							</td>
						</tr>
					</table>
					<p>
						<input type="submit" class="button" value="追加確認" />
						<input type="button" class="button" value="一覧画面に戻る" onclick="returnbukenLst()" />
						<script>
							function returnbukenLst() {
								location.href = '[[@{/buken/searchLst}]]';
							}

						</script>
					</p>
				</form>
			</div>
		</div>
		<div id="footer">
			<div id="footer_bg">
				ABC@126.com
			</div>
		</div>
	</div>
	
	<script type="text/javascript">
	    var contextPath = /*[[@{/}]]*/ '';
	    console.log("Context Pathsss:", contextPath);
	</script>
</body>

</html>
