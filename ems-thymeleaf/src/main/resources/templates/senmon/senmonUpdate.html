<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns:th="http://www.thymealf.org">

<head>
	<title>専門学生更新画面</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
</head>

<body>
	<div id="wrap">
		<div id="top_content">
			<div id="header">
				<div id="rightheader">
					<p>
						2009/11/20
						<br />
					</p>
				</div>
				<div id="topheader">
					<h1 id="title">
						<a href="#">main</a>
					</h1>
				</div>
				<div id="navigation">
				</div>
			</div>
			<div id="content">
				<p id="whereami">
				</p>
				<h1>
					専門学生の更新
				</h1>
				<form th:action="@{/senmon/update}" method="post">
					<table cellpadding="0" cellspacing="0" border="0" class="form_table">
						
						<input type="hidden" class="inputgri" name="studentId" 
														th:value="${obj.studentId}" />
														
						<tr>
							<td valign="middle" align="right">
								名前:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="studentName" 
								th:value="${obj.studentName}" />
							</td>
						</tr>

						<tr>
							<td valign="middle" align="right">
								性別:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="sex" th:value="${obj.sex}" />
							</td>
						</tr>
						<tr>
							<td valign="middle" align="right">
								学科:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="gakka"  th:value="${obj.gakka}" />
							</td>
						</tr>
						<tr>
							<td valign="middle" align="right">
								コース:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="course" th:value="${obj.course}" />
							</td>
						</tr>
						<tr>
							<td valign="middle" align="right">
								メールアドレス:
							</td>
							<td valign="middle" align="left">
								<input type="text" class="inputgri" name="mail" th:value="${obj.mail}" />
							</td>
						</tr>
						
						
					</table>
					<p>
						<input type="submit" class="button" value="確認" />
						<input type="button" class="button" value="検索一覧に戻る" onclick="returnSenmonList()" />
						<script>
							function returnSenmonList() {
								location.href = '[[@{/senmon/manageSenmon}]]';
							}

						</script>
					</p>
				</form>
			</div>
		</div>
		<div id="footer">
			<div id="footer_bg">
				ABC@126.com
			</div>
		</div>
	</div>
</body>

</html>
