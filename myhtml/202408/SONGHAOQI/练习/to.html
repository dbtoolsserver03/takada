<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Received Data</title>
    <script>
        window.onload = function() {
            // 获取URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const inputText = urlParams.get('input');

            // 显示接收到的内容
            if (inputText) {
                document.getElementById('receivedData').innerText = decodeURIComponent(inputText);
            }
        }
    </script>
</head>
<body>
    <h1>接收到的内容：</h1>
    <p id="receivedData"></p>
</body>
</html>
